@let isDescriptionOnTheLeft = descriptionPosition === 'left';
<div [class]="`${descriptionPosition} ${theme} row`">
  <div class="description" [appRevealOnScroll]="isDescriptionOnTheLeft ? 'left-right' : 'right-left'">
    <ng-content></ng-content>
  </div>
  <img
    [src]="src"
    [alt]="alt"
    [class]="`${theme} photo`"
    [appRevealOnScroll]="isDescriptionOnTheLeft ? 'right-left' : 'left-right'" />
</div>
