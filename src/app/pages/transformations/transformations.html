<div class="base-container">
  <p appRevealOnScroll="left-right">Moi najdoskonalsi uczniowie:</p>
  <img
    ngSrc="/assets/images/uczen-przysiady.png"
    alt="Andrzej Muskuł uczy przysiadu"
    appRevealOnScroll="left-right"
    height="700" width="700" />
</div>
<div class="base-container" appRevealOnScroll="left-right">
  <p>Spójrzcie tylko na te transformacje!</p>
</div>
<div class="transformation-container">
  <img
    ngSrc="/assets/images/uczen1-przed.png"
    alt="Andrzej Muskuł z uczniem przed treningiem"
    appRevealOnScroll="left-right"
    height="780" width="520" />
  <mat-icon class="arrow_forward" appRevealOnScroll="left-right">arrow_forward</mat-icon>
  <mat-icon class="arrow_down" appRevealOnScroll="left-right">arrow_downward</mat-icon>
  <img
    ngSrc="/assets/images/uczen1.png"
    alt="Andrzej Muskuł uczy nowicjusza"
    appRevealOnScroll="left-right"
    height="800" width="800" />
</div>
<div class="transformation-container">
  <img
    ngSrc="/assets/images/uczen2-przed.png"
    alt="Andrzej Muskuł z uczniem przed treningiem"
    appRevealOnScroll="right-left"
    height="780" width="520" />
  <mat-icon class="arrow_forward" appRevealOnScroll="right-left">arrow_forward</mat-icon>
  <mat-icon class="arrow_down" appRevealOnScroll="right-left">arrow_downward</mat-icon>
  <img
    ngSrc="/assets/images/uczen2.png"
    alt="Andrzej Muskuł uczy nowicjusza"
    appRevealOnScroll="right-left"
    height="800" width="800" />
</div>
