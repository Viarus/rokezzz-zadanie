<div class="base-container">

  <img
    src="/assets/images/uczen-przysiady.png"
    alt="Andrzej Muskuł uczy przysiadu"
  />
</div>
<div class="base-container" appRevealOnScroll="left-right">

    src="/assets/images/uczen1-przed.png"

  />

  <mat-icon class="arrow_down" appRevealOnScroll="left-right">arrow_downward</mat-icon>

    src="/assets/images/uczen1.png"
    alt="Andrzej Muskuł z uczniem przed treningiem"

</div>
<div class="transformation-container">
  <img
    src="/assets/images/uczen2-przed.png"

  />

  <mat-icon class="arrow_down" appRevealOnScroll="right-left">arrow_downward</mat-icon>
